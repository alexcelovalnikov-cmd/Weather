name: weather-bridge

services:
  app:
    image: ${WEATHER_IMAGE:-weather-bridge:V2}
    container_name: weather-bridge-app
    restart: unless-stopped
    env_file:
      - /opt/weather-bridge/secrets/.env
    ports:
      - "127.0.0.1:${WEATHER_BIND_PORT:-8789}:8787"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
