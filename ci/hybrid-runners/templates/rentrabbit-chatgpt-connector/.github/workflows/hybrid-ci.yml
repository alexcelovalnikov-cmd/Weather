name: Hybrid CI
run-name: hybrid-${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact source commit (PR merge SHA or branch head)
        required: true
        type: string
      runner:
        description: Explicit attempt destination selected by coordinator
        required: true
        type: choice
        options: [local-linux, local-mac, github-linux]
      dispatch_id:
        description: Coordinator correlation ID
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: hybrid-${{ inputs.target_sha }}-${{ inputs.dispatch_id }}
  cancel-in-progress: false
jobs:
  test:
    if: github.actor == 'alexcelovalnikov-cmd' && (inputs.runner == 'local-linux' || inputs.runner == 'github-linux')
    runs-on: ${{ fromJSON(inputs.runner == 'local-linux' && '["self-hosted","Linux","X64","local-linux","hybrid-v1","hybrid-rentrabbit-chatgpt-connector-linux"]' || inputs.runner == 'local-mac' && '["self-hosted","macOS","ARM64","local-mac","hybrid-v1","hybrid-weather-mac"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 25
    steps:
      - name: Validate immutable dispatch
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DISPATCH_ID" =~ ^[0-9a-f]{32}$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/run_offline_tests.py -q
      - run: python scripts/export_schema.py --check
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/run_offline_tests.py -q
      - run: python scripts/export_schema.py --check
      - name: Build deployment container
        run: docker build --tag rentrabbit-connector:test .
      - name: Build and run isolated deployment tests
        run: |
          docker build -f Dockerfile.test --build-arg BASE_IMAGE=rentrabbit-connector:test --tag rentrabbit-tests:test .
          docker run --rm --network none rentrabbit-tests:test
