name: CI
on:
  push:
    branches: [main, stage]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check server.js
      - run: node test/oauth-smoke.mjs
